<style>

.desk-pet{position:absolute;right:clamp(22px,7vw,140px);bottom:clamp(25px,8vh,110px);width:340px;z-index:5;transform:translate(var(--frame-x),var(--frame-y)) rotate(var(--frame-tilt));filter:drop-shadow(0 12px 12px #39432320);user-select:none;touch-action:none;transition:opacity .4s}

.grasp{position:absolute;top:0;left:23%;right:23%;height:27px;border:0;background:transparent;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none}.grasp:active{cursor:grabbing}.grasp:before{content:'';width:25px;height:3px;border-radius:5px;background:#a5a98b;box-shadow:0 5px #c6c7a9}.nail{position:absolute;width:4px;height:4px;border-radius:50%;background:#929b78;top:9px;box-shadow:1px 1px #f9f4de}.nail.left{left:10px}.nail.right{right:10px}
.rail{position:relative;height:82px;border-radius:36px;background:#c9cfac;border:2px solid #aab68e;box-shadow:inset 0 3px 4px #7c86612e;touch-action:none}.rail:before{content:'';position:absolute;left:22px;right:22px;top:40px;border-top:1px dashed #8c9c75;opacity:.6}.rail-fill{position:absolute;inset:0;clip-path:inset(0 calc((1 - var(--progress))*100%) 0 0 round 32px);border-radius:34px;background:linear-gradient(90deg,#b2bd8e,#e5d096);transition:background 1s}.railsun{position:absolute;right:12px;top:12px;width:54px;height:54px;color:#83916b;opacity:calc(.55 + var(--progress)*.45);transform:rotate(calc(var(--progress)*100deg));transition:color .3s}.railsun svg{width:100%;height:100%}.railhouse{position:absolute;left:15px;top:26px;width:31px;height:29px;opacity:calc(1 - var(--progress)*.8);color:#7c9066}.railhouse svg{width:100%;height:100%}
.pet{width:72px;height:81px;position:absolute;top:-3px;left:0;transform:translateX(var(--pet-x));z-index:4;touch-action:none;cursor:grab;border:0;background:none;padding:0;border-radius:30px;outline-offset:5px}.pet:active{cursor:grabbing}.pet-art{width:82px;height:91px;margin-left:-5px;overflow:visible;transform:rotate(var(--pet-tilt)) scaleX(var(--pet-squash));transform-origin:50% 75%}.pet-eye{animation:blink 8s infinite;transform-box:fill-box;transform-origin:center}.pet-shadow{position:absolute;left:17px;right:8px;bottom:-1px;height:6px;border-radius:50%;background:#6c79552b;filter:blur(1px);transform:scaleX(var(--pet-squash))}.scarf-tail{transform-origin:54px 66px;transform:rotate(calc(var(--pet-tilt)*-1.2))}.pet.docked .pet-art{animation:dock .6s ease-out}.pet.waiting .pet-art{animation:breathe 4s ease-in-out infinite}
.travel-leaves{position:absolute;inset:-10px;pointer-events:none;overflow:visible}.leaf-particle{position:absolute;background:#a4b479;width:10px;height:5px;border-radius:100% 0 100% 0;opacity:0}.leaf-particle:nth-child(1){left:29%;top:67%;transform:translate(calc(var(--progress)*-14px),calc(var(--progress)*-22px)) rotate(calc(var(--progress)*-120deg));opacity:calc(var(--progress)*.7)}.leaf-particle:nth-child(2){left:58%;top:20%;transform:translate(calc(var(--progress)*-8px),calc(var(--progress)*-18px)) rotate(calc(var(--progress)*150deg));opacity:calc(var(--progress)*.6)}.leaf-particle:nth-child(3){left:76%;top:73%;transform:translate(calc(var(--progress)*-17px),calc(var(--progress)*-11px)) rotate(calc(var(--progress)*-60deg));opacity:calc(var(--progress)*.8)}
.subrail{height:25px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 7px;color:#7d8866}.track-arrows{display:flex;gap:13px;align-items:center;opacity:.65;transition:opacity .4s}.track-arrows span{width:7px;height:7px;border-top:1px solid;border-right:1px solid;transform:rotate(45deg);animation:hint 2.4s ease-in-out infinite}.track-arrows span:nth-child(2){animation-delay:.15s}.track-arrows span:nth-child(3){animation-delay:.3s}.track-symbol{width:19px;height:17px}.track-symbol svg{width:100%;height:100%}.is-rest .track-arrows{opacity:0}

.drawer{position:absolute;bottom:calc(100% + 17px);left:0;width:100%;background:#f5eed7;border-radius:3px 5px 9px 3px;box-shadow:2px 5px 0 #79846426;transform-origin:80% 100%;padding:24px 22px 20px;user-select:text;touch-action:auto;animation:open .26s ease-out}.drawer[hidden]{display:none}.drawer:after{content:'';position:absolute;bottom:-9px;right:54px;width:20px;height:20px;transform:rotate(45deg);background:#f5eed7;z-index:-1}.drawer h2{margin:0 0 15px;font-size:21px;font-weight:400}.drawer .close{position:absolute;right:12px;top:8px;border:0;background:none;font-size:23px;color:#92957b;line-height:1;padding:3px}.tabs{display:flex;gap:19px;border-bottom:1px solid #d7d3b9;margin-bottom:12px}.tabs button{font-size:16px;border:0;background:none;color:#8c9277;padding:3px 0 8px}.tabs button[aria-selected=true]{color:#445b3e;border-bottom:2px solid #7c9060}
textarea{width:100%;min-height:110px;max-height:210px;resize:vertical;border:0;background:repeating-linear-gradient(transparent,transparent 31px,#d4d1b544 31px,#d4d1b544 32px);line-height:32px;font-size:18px;padding:0;outline:none;border-radius:0}.drawer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:12px}.drawer-foot small{color:#8d9279;font-size:12px;line-height:1.5}.ink-btn{border:0;color:#f6efd7;background:#6c8357;padding:7px 17px;border-radius:16% 11% 13% 8% / 12% 17% 11% 16%;font-size:16px;white-space:nowrap}.ink-btn:hover{background:#526c42}.entries{max-height:210px;overflow:auto;padding:0;margin:0;list-style:none}.entries li{position:relative;padding:9px 0 11px;border-bottom:1px dashed #cdcbb0;font-size:17px;line-height:1.7;white-space:pre-wrap;word-break:break-word}.entries time{display:block;color:#92967c;font-size:11px}.empty{font-size:16px;color:#8b9277;line-height:1.8;margin:12px 0}.confirm-copy{font-size:17px;line-height:1.8;margin:0 0 12px}.start-buttons{display:flex;gap:15px;justify-content:flex-end}.plain-btn{border:0;background:transparent;color:#8a9478;padding:7px 0;font-size:16px}.drawer .hint{font-size:13px;line-height:1.6;color:#92957c;margin:0 0 10px}.message{position:absolute;right:14px;left:14px;bottom:-28px;text-align:center;font-size:13px;color:#596d4b;opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none}.message.show{opacity:1;transform:translateY(0)}

.drawer.below{bottom:auto;top:calc(100% + 17px);transform-origin:80% 0}.drawer.below:after{bottom:auto;top:-9px}

/* Blue-hour rail. The wrapper remains only for layout, with no outer frame. */
:root{--ink:#33465f;--paper:#f0f4f9}
.desk-pet{width:320px;filter:none}
.frame,.is-rest .frame{background:transparent;border:0;border-radius:0;box-shadow:none;min-height:76px;padding:0}
.nail,.subrail{display:none}
.rail{height:76px;border-radius:44px;background:linear-gradient(150deg,#f6f9fc,#dae4f0);border:1px solid #b9cadd99;box-shadow:inset 0 1px 1px #ffffffd9,0 10px 26px #1b34511c}
.rail:before{top:37px;left:44px;right:44px;border-color:#9fb3cc;opacity:.35}

.is-rest .rail-fill{background:linear-gradient(105deg,#304e73b3,#213b61b3)}

.is-rest .pet-art{filter:drop-shadow(0 0 9px #b2cdf22a)}
.is-rest .pet-shadow{background:#0813295c}

.is-rest .drawer:after{background:#233953}
.is-rest .tabs{border-color:#aac1df2b}.is-rest .tabs button{color:#92a9c6}.is-rest .tabs button[aria-selected=true]{color:#e0eaf5;border-color:#d4b081}
.is-rest textarea{background:repeating-linear-gradient(transparent,transparent 31px,#a3bed717 31px,#a3bed717 32px)}

<body>
<main class="wallpaper" aria-label="滑轨换班桌面体验">
  <div class="landscape rest-art" aria-hidden="true"><video id="nightVideo" class="night-video" muted loop playsinline preload="metadata" poster="assets/night-poster.jpg?v=20261123-cat-left"><source src="assets/night-loop.mp4?v=20261123-cat-left" type="video/mp4"></video></div>
  <div class="sun-dust" aria-hidden="true"><i class="dust"></i><i class="dust"></i><i class="dust"></i><i class="dust"></i></div>
  <section class="desk-pet" id="deskPet" aria-label="可移动的换班小框">
    <div class="drawer" id="drawer" hidden>
      <button class="close" id="closeDrawer" aria-label="收起抽屉">×</button>
      <section id="writePanel" hidden>
        <div class="tabs" role="tablist" aria-label="记录类型"><button role="tab" aria-selected="true" id="handoffTab">交接</button><button role="tab" aria-selected="false" id="memoTab">备忘</button></div>
        <label for="noteInput" class="sr">留下工作交接或备忘</label><textarea id="noteInput" maxlength="600" placeholder="做到哪里，留在这里。"></textarea>
        <div class="drawer-foot"><small id="saveHint">已经下班，不写也可以。</small><button class="ink-btn" id="saveNote">交给它</button></div>
      </section>
      <section id="readPanel" hidden><h2>替你收好了。</h2><ul class="entries" id="entries"></ul><p class="empty" id="emptyEntries">这里还没有便笺。<br>直接休息也可以。</p></section>
      <section id="startPanel" hidden><h2>现在开始上班吗？</h2><div class="entries" id="startSummary"></div><div class="start-buttons"><button class="plain-btn" id="stayResting">再待一会儿</button><button class="ink-btn" id="confirmStart">确认上班</button></div></section>
      <section id="offPanel" hidden><h2>今天先到这里？</h2><p class="confirm-copy">确认下班后，再慢慢交接。<br>没做完的，也可以先留下。</p><div class="start-buttons"><button class="plain-btn" id="cancelOff">还没，先等等</button><button class="ink-btn" id="confirmOff">确认下班</button></div></section>
      <section id="infoPanel" hidden><h2>另一面</h2><p class="confirm-copy">滑到底，确认后就下班。<br>交接和备忘可以稍后再写。<br>再次打开，仍是休息这一面，直到你确认上班。</p><p class="hint">当前是网页交互小样，画面里的悬浮框和壁纸都是预览。未修改系统桌面，也未接入真实 AI。记录只存在这台设备的浏览器中。</p><button class="ink-btn" id="reopenPreview">模拟再次打开</button></section>
    </div>
    <div class="frame" id="frame">
  <nav class="corner-tools" aria-label="原型选项"><button id="soundBtn" aria-label="开启声音" aria-pressed="false" title="声音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9h5l5-4v14l-5-4H3Z"/><path id="soundPath" d="m17 9 5 6m0-6-5 6"/></svg></button><button id="infoBtn" aria-label="原型说明与模拟重新打开" title="原型说明"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 10v7m0-11v1"/></svg></button></nav>
      <i class="nail left" aria-hidden="true"></i><i class="nail right" aria-hidden="true"></i>
      <button class="grasp" id="grasp" aria-label="拖动小框位置"></button>
      <div class="rail" id="rail">
        <div class="rail-fill"></div>
        <div class="railhouse" aria-hidden="true"><svg viewBox="0 0 34 32" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="28" height="20" rx="3"/><path d="M12 29h10m-5-4v4"/></svg></div>
        <div class="railsun" aria-hidden="true"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M40 13a20 20 0 1 0 8 31 18 18 0 0 1-8-31Z"/><path d="m45 15 1.5 4.5L51 21l-4.5 1.5L45 27l-1.5-4.5L39 21l4.5-1.5Z"/></svg></div>
        <div class="travel-leaves" aria-hidden="true"><i class="leaf-particle"></i><i class="leaf-particle"></i><i class="leaf-particle"></i></div>
        <div class="pet waiting" id="pet" role="slider" tabindex="0" aria-label="向右滑动下班" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="工作中，向右滑动下班">
          <i class="pet-shadow"></i>
          <svg class="pet-art" viewBox="0 0 82 91" aria-hidden="true">
            <path d="M60 66q18 0 15-18" fill="none" stroke="#101a2d" stroke-width="8" stroke-linecap="round"/>
            <path d="M15 76Q9 58 14 36L15 12q1-5 5-2l16 17q8-3 15 0L64 8q5-3 6 3l-1 29q7 18 0 37l-12 3-14-2-14 3Z" fill="#101a2d"/>
            <g class="pet-eye" fill="none" stroke="#e9c17e" stroke-width="2.6"><path d="M36 48c0 13-17 14-17 1s17-14 17-1Z"/><path d="M59 47c1 12-16 15-17 2s16-14 17-2Z"/></g>
          </svg>
        </div>
      </div>
      <div class="rest-controls" id="restControls" aria-label="下班后的操作" hidden>
        <button class="icon-btn" id="writeBtn" aria-label="写交接或备忘" title="交接与备忘"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor"><path d="m7 4 13-1 4 5v19H6Z M20 3v6h5M10 14h10m-10 5h8"/></svg></button>
        <button class="icon-btn memo-control" id="readBtn" aria-label="查看保管的便笺" title="保管的便笺"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor"><path d="M4 10h23v15H4ZM3 6h24v5H3ZM11 15h8"/></svg><i class="small-count" id="noteDot" hidden></i></button>
        <button class="icon-btn" id="startBtn" aria-label="准备开始上班" title="开始上班"><svg viewBox="0 0 30 30" fill="none" stroke="currentColor"><path d="M16 4h9v22h-9M4 15h15m-5-5 5 5-5 5"/></svg></button>
      </div>
      <div class="subrail" aria-hidden="true"><span class="track-symbol"><svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 5h17v10H3Zm5 13h7m-4-3v3"/></svg></span><span class="track-arrows"><span></span><span></span><span></span></span><span class="track-symbol"><svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 11h11v6H5ZM16 12h2q4 2 0 4h-2M8 7q-2-2 0-4m5 4q2-2 0-4"/></svg></span></div>
    </div>
    <div class="message" id="message" role="status"></div>
  </section>

</main>
<div class="grain" aria-hidden="true"></div><div class="sr" id="announcement" aria-live="polite"></div>
<script>
(()=>{
'use strict';const $=id=>document.getElementById(id),KEY='another-side-rail-v2',reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let pendingOff=false;
let state={version:2,mode:'working',entries:[],draft:'',kind:'handoff',restedAt:null},p=0,target=0,velocity=0,raf=0,drag=null,windowDrag=null,currentPanel=null,sound=false,audio=null,messageTimer=0,dockTimer=0,lastTime=0;
let loadError=false;try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d.version!==2||!['working','resting'].includes(d.mode)||!Array.isArray(d.entries)||typeof d.draft!=='string'||!d.entries.every(e=>typeof e.id==='string'&&typeof e.text==='string'&&['handoff','memo'].includes(e.kind)&&typeof e.at==='string'))throw Error('invalid');state={...state,...d,entries:d.entries.slice(-100),kind:d.kind==='memo'?'memo':'handoff'};}}catch{loadError=true;}
function announce(t){$('announcement').textContent=t;}
function showMessage(t){$('message').textContent=t;$('message').classList.add('show');clearTimeout(messageTimer);messageTimer=setTimeout(()=>$('message').classList.remove('show'),2800);announce(t);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true;}catch{showMessage('未能保存到本机，请先保留文字。');return false;}}
function audioTick(end=false){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const duration=end?.13:.1,osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(end?430:230,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(end?220:170,audio.currentTime+duration);gain.gain.setValueAtTime(.02,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+duration);}catch{sound=false;}}
function travel(){return Math.max(0,$('rail').clientWidth-72);}
function paint(){const tilt=drag?Math.max(-12,Math.min(12,velocity*220)):velocity*110,squash=1+Math.min(.12,Math.abs(velocity)*2);$('deskPet').style.setProperty('--progress',p);$('deskPet').style.setProperty('--pet-x',(p*travel())+'px');$('deskPet').style.setProperty('--pet-tilt',reduced?'0deg':tilt+'deg');$('deskPet').style.setProperty('--pet-squash',reduced?'1':squash);$('deskPet').style.setProperty('--frame-tilt',reduced?'0deg':Math.max(-.8,Math.min(.8,velocity*18))+'deg');$('pet').setAttribute('aria-valuenow',Math.round(p*100));}
function tick(time){const dt=Math.min(2.1,Math.max(.2,(time-lastTime)/16.67||1));lastTime=time;if(reduced){p=target;velocity=0;}else{velocity+=(target-p)*.14*dt;velocity*=Math.pow(.63,dt);p=Math.max(0,Math.min(1,p+velocity*dt));}paint();if(Math.abs(p-target)>.0003||Math.abs(velocity)>.0003){raf=requestAnimationFrame(tick);}else{p=target;velocity=0;raf=0;paint();if(!drag&&target===1&&state.mode==='working'&&!pendingOff)requestOff();}}
function moveTo(value){target=Math.max(0,Math.min(1,value));if(!raf){lastTime=performance.now();raf=requestAnimationFrame(tick);}}
function syncNightPlayback(){const v=$('nightVideo');if(!v)return;if(state.mode==='resting'&&!document.hidden&&!reduced){v.play().catch(()=>{});}else v.pause();}
document.addEventListener('visibilitychange',syncNightPlayback);
function renderMode(){const resting=state.mode==='resting';document.body.classList.toggle('is-rest',resting);$('restControls').hidden=!resting;$('pet').setAttribute('aria-label',resting?'代理已接班':'向右滑动下班');$('pet').setAttribute('aria-valuetext',resting?'已经下班，代理值班中':'工作中，向右滑动下班');$('pet').setAttribute('aria-disabled',String(resting));$('pet').setAttribute('role',resting?'img':'slider');$('pet').tabIndex=resting?-1:0;$('noteDot').hidden=state.entries.length===0;$('pet').classList.toggle('waiting',!resting);syncNightPlayback();}
function requestOff(){pendingOff=true;$('pet').setAttribute('aria-disabled','true');openPanel('off');announce('是否确认下班？确认前仍保持工作状态。');}
function finishShift(){pendingOff=false;closePanel();state.mode='resting';state.restedAt=new Date().toISOString();persist();renderMode();$('pet').classList.add('docked');clearTimeout(dockTimer);dockTimer=setTimeout(()=>$('pet').classList.remove('docked'),700);audioTick(true);announce('已经下班。交接和备忘可以稍后再写。');openPanel('write',false);}
function onDown(e){if(state.mode!=='working'||pendingOff||e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();drag={id:e.pointerId,startX:e.clientX,startP:p,lastX:e.clientX,shifted:false,tick:0};$('pet').classList.remove('waiting');$('pet').setPointerCapture(e.pointerId);}
function onMove(e){if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.startX;drag.shifted||=Math.abs(dx)>3;velocity=Math.max(-.06,Math.min(.06,(e.clientX-drag.lastX)/100));drag.lastX=e.clientX;moveTo(drag.startP+dx/travel());const bin=Math.floor(target*8);if(bin!==drag.tick){drag.tick=bin;audioTick();}}
function onUp(e){if(!drag||e.pointerId!==drag.id)return;const complete=target>=.88;drag=null;if($('pet').hasPointerCapture(e.pointerId))$('pet').releasePointerCapture(e.pointerId);moveTo(complete?1:0);if(!complete)$('pet').classList.add('waiting');}
function cancel(){if(!drag)return;drag=null;moveTo(0);$('pet').classList.add('waiting');}
$('pet').addEventListener('pointerdown',onDown);$('pet').addEventListener('pointermove',onMove);$('pet').addEventListener('pointerup',onUp);$('pet').addEventListener('pointercancel',cancel);
$('pet').addEventListener('keydown',e=>{if(state.mode!=='working'||pendingOff)return;let next=target;if(e.key==='ArrowRight')next+=.1;else if(e.key==='ArrowLeft')next-=.1;else if(e.key==='Home')next=0;else if(e.key==='End')next=1;else if((e.key==='Enter'||e.key===' ')&&target>=.88)next=1;else if(e.key==='Escape')next=0;else return;e.preventDefault();moveTo(next);});
function closePanel(){const was=currentPanel;$('drawer').hidden=true;currentPanel=null;if(was==='off'&&pendingOff){pendingOff=false;renderMode();moveTo(0);$('pet').focus();}else if(was==='start')$('startBtn').focus();else if(was==='read')$('readBtn').focus();else if(was==='write'&&state.mode==='resting')$('writeBtn').focus();}
function placeDrawer(){if(!currentPanel)return;const box=$('frame').getBoundingClientRect(),above=box.top-26,below=innerHeight-box.bottom-26,down=above<260&&below>above;$('drawer').classList.toggle('below',down);$('drawer').style.maxHeight=Math.max(100,down?below:above)+'px';$('drawer').style.overflowY='auto';}
function openPanel(which,focus=true){if(pendingOff&&which!=='off'){pendingOff=false;renderMode();moveTo(0);}currentPanel=which;['write','read','start','off','info'].forEach(n=>$(n+'Panel').hidden=n!==which);$('drawer').hidden=false;if(which==='write'){$('noteInput').value=state.draft;renderKind();if(focus)$('noteInput').focus();}else if(which==='read'){renderEntries();if(focus)$('closeDrawer').focus();}else if(which==='start'){renderStart();if(focus)$('stayResting').focus();}else if(which==='off'){if(focus)$('cancelOff').focus();}else if(focus)$('closeDrawer').focus();placeDrawer();}
function renderKind(){$('handoffTab').setAttribute('aria-selected',String(state.kind==='handoff'));$('memoTab').setAttribute('aria-selected',String(state.kind==='memo'));$('noteInput').placeholder=state.kind==='handoff'?'做到哪里，留在这里。':'突然想起的，记一句就好。';}
function renderEntries(){$('entries').replaceChildren();$('emptyEntries').hidden=state.entries.length>0;for(const entry of [...state.entries].reverse()){const li=document.createElement('li'),time=document.createElement('time');time.dateTime=entry.at;time.textContent=(entry.kind==='handoff'?'交接 · ':'备忘 · ')+new Date(entry.at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});li.append(time,document.createTextNode(entry.text));$('entries').append(li);}}
function renderStart(){const last=state.entries.at(-1);$('startSummary').replaceChildren();if(last){const p=document.createElement('p');p.className='confirm-copy';p.textContent=last.text;$('startSummary').append(p);}else{const p=document.createElement('p');p.className='hint';p.textContent='没有留下便笺，也可以开始。';$('startSummary').append(p);}}
$('closeDrawer').addEventListener('click',closePanel);$('writeBtn').addEventListener('click',()=>currentPanel==='write'?closePanel():openPanel('write'));$('readBtn').addEventListener('click',()=>currentPanel==='read'?closePanel():openPanel('read'));$('startBtn').addEventListener('click',()=>openPanel('start'));$('infoBtn').addEventListener('click',()=>currentPanel==='info'?closePanel():openPanel('info'));
$('handoffTab').addEventListener('click',()=>{state.kind='handoff';renderKind();persist();});$('memoTab').addEventListener('click',()=>{state.kind='memo';renderKind();persist();});$('noteInput').addEventListener('input',()=>{state.draft=$('noteInput').value;persist();});
$('saveNote').addEventListener('click',()=>{const text=$('noteInput').value.trim();if(!text){$('saveHint').textContent='空着也可以，直接收起。';$('noteInput').focus();return;}const entry={id:crypto.randomUUID?.()||String(Date.now())+Math.random(),text,kind:state.kind,at:new Date().toISOString()};const prev=state.entries;state.entries=[...prev,entry].slice(-100);const draft=state.draft;state.draft='';if(!persist()){state.entries=prev;state.draft=draft;return;}$('noteInput').value='';renderMode();closePanel();showMessage('收好了。');audioTick(true);});
$('cancelOff').addEventListener('click',closePanel);$('confirmOff').addEventListener('click',()=>{if(pendingOff)finishShift();});
$('stayResting').addEventListener('click',closePanel);$('confirmStart').addEventListener('click',()=>{state.mode='working';state.restedAt=null;persist();closePanel();renderMode();moveTo(0);$('pet').focus();announce('已经确认上班。');});
$('reopenPreview').addEventListener('click',()=>location.reload());
$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').setAttribute('aria-pressed',String(sound));$('soundBtn').setAttribute('aria-label',sound?'关闭声音':'开启声音');$('soundPath').setAttribute('d',sound?'M17 8q5 4 0 8m3-11q7 7 0 14':'m17 9 5 6m0-6-5 6');if(sound)audioTick(true);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(currentPanel)closePanel();else if(drag)cancel();}});
const grasp=$('grasp');let frameOffset={x:0,y:0};grasp.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;const box=$('deskPet').getBoundingClientRect();windowDrag={id:e.pointerId,startX:e.clientX,startY:e.clientY,x:frameOffset.x,y:frameOffset.y,box};grasp.setPointerCapture(e.pointerId);});grasp.addEventListener('pointermove',e=>{if(!windowDrag||e.pointerId!==windowDrag.id)return;const d=windowDrag,dx=e.clientX-d.startX,dy=e.clientY-d.startY;frameOffset.x=d.x+Math.max(12-d.box.left,Math.min(innerWidth-12-d.box.right,dx));frameOffset.y=d.y+Math.max(20-d.box.top,Math.min(innerHeight-20-d.box.bottom,dy));$('deskPet').style.setProperty('--frame-x',frameOffset.x+'px');$('deskPet').style.setProperty('--frame-y',frameOffset.y+'px');placeDrawer();});function endFrame(e){if(!windowDrag)return;windowDrag=null;if(grasp.hasPointerCapture(e.pointerId))grasp.releasePointerCapture(e.pointerId);}grasp.addEventListener('pointerup',endFrame);grasp.addEventListener('pointercancel',endFrame);
addEventListener('resize',()=>{frameOffset={x:0,y:0};$('deskPet').style.setProperty('--frame-x','0px');$('deskPet').style.setProperty('--frame-y','0px');paint();placeDrawer();});
p=target=state.mode==='resting'?1:0;renderMode();paint();if(loadError)showMessage('旧记录未能读取，本次从工作状态开始。');
})();
</script>
