scene.add(new T.HemisphereLight(0xfff4d9,0x7a9ea4,1.4));let sun=new T.DirectionalLight(0xffe0ad,1.8);sun.position.set(-14,24,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;scene.add(sun);

];let states={boat:false,home:false,pencil:false,listening:false,moon:false,notebook:false,clock:false},active=null,rotX=0,rotY=0,inspectDrag=false,ix=0,iy=0,paused=true,muted=false,audio,master,musicTimer,musicStep=0;

let inventory=$('#inventory');for(let it of items){let e=document.createElement('div');e.className='slot';e.dataset.id=it.id;e.innerHTML=it.icon+'<i class="dot"></i>';e.title=it.name;inventory.append(e);e.onclick=()=>{if(it.done)openInspect(it)}}
const inspectRenderer=new T.WebGLRenderer({canvas:inspectCanvas,antialias:true,alpha:true});inspectRenderer.setPixelRatio(Math.min(devicePixelRatio,2));inspectRenderer.outputColorSpace=T.SRGBColorSpace;inspectRenderer.toneMapping=T.ACESFilmicToneMapping;inspectRenderer.toneMappingExposure=1.05;
const inspectScene=new T.Scene();inspectScene.add(new T.HemisphereLight(0xffffff,0xbb987f,1.8));let il=new T.DirectionalLight(0xffe4bd,1.6);il.position.set(-3,5,6);inspectScene.add(il);const inspectCamera=new T.PerspectiveCamera(42,1,.1,100);inspectCamera.position.set(0,1.1,5.4);inspectCamera.lookAt(0,1.12,0);let inspectModel;
function openInspect(it){active=it;paused=true;keys={};rotX=0;rotY=0;$('#inspect-name').textContent=it.name;$('#clue').textContent='';$('#action').classList.remove('show');if(inspectModel)inspectScene.remove(inspectModel);inspectModel=build(it.model);inspectModel.position.y=-.2;inspectModel.scale.setScalar(it.id==='pencil'?1.55:1.7);inspectScene.add(inspectModel);$('#inspect').classList.add('show');playEffect('paper');updateInspect()}
function closeInspect(){let panel=$('#inspect');panel.classList.add('closing');active=null;setTimeout(()=>{panel.classList.remove('show','closing');paused=false},280)}
function updateInspect(){if(!active)return;let a=$('#action'),clue=$('#clue'),show=false,symbol='✦';if(active.id==='clock'&&!states.clock&&Math.abs(rotY)>1.6){show=true;symbol='◁'}if(active.id==='headphones'&&!states.listening&&Math.abs(Math.sin(rotY))>.65){show=true;symbol='♪'}if(active.id==='pencil'&&!states.pencil&&Math.abs(rotY)>1.3){show=true;symbol='✎'}if(active.id==='mug'&&!states.home&&states.boat){show=true;symbol='⛵'}if(active.id==='laptop'&&!states.moon&&states.listening){show=true;symbol='☾'}if(active.id==='notebook'&&!states.notebook&&states.moon){show=true;symbol='☾'}a.textContent=symbol;a.classList.toggle('show',show);if(active.done)clue.textContent=active.clue||''}
function action(){if(!active)return;let id=active.id;if(id==='clock'&&!states.clock){states.clock=true;states.boat=true}else if(id==='mug'&&states.boat&&!states.home){states.home=true}else if(id==='pencil'&&!states.pencil){states.pencil=true}else if(id==='headphones'&&!states.listening){states.listening=true}else if(id==='laptop'&&states.listening&&!states.moon){states.moon=true}else if(id==='notebook'&&states.moon&&!states.notebook){states.notebook=true}else return;active.done=true;active.clue=active.memory;$('#memory-'+id).textContent=active.memory;active.group.rotation.y+=.2;let slot=inventory.querySelector('[data-id="'+id+'"]');slot.classList.add('found');slot.setAttribute('aria-label',active.name+'：'+active.memory);$('#clue').textContent=active.memory;$('#action').classList.remove('show');playEffect(id==='mug'?'ceramic':'paper');worldChange();if(id==='mug'||id==='laptop'||id==='notebook'){inspectScene.remove(inspectModel);inspectModel=build(id);inspectModel.position.y=-.2;inspectModel.scale.setScalar(1.7);inspectScene.add(inspectModel)}}
$('#action').onclick=action;$('#close-inspect').onclick=closeInspect;inspectCanvas.addEventListener('pointerdown',e=>{inspectDrag=true;ix=e.clientX;iy=e.clientY;inspectCanvas.setPointerCapture(e.pointerId)});inspectCanvas.addEventListener('pointermove',e=>{if(!inspectDrag||!inspectModel)return;rotY+=(e.clientX-ix)*.011;rotX+=(e.clientY-iy)*.011;rotX=Math.max(-Math.PI,Math.min(Math.PI,rotX));inspectModel.rotation.set(rotX,rotY,0);ix=e.clientX;iy=e.clientY;updateInspect()});inspectCanvas.addEventListener('pointerup',()=>inspectDrag=false);
let yaw=0,pitch=0,skyX=0,skyY=0,drag=false,moved=0,lastX=0,lastY=0,keys={},hover=null,started=false,finished=false,walkTime=0;const ray=new T.Raycaster();
sceneCanvas.addEventListener('pointerdown',e=>{drag=true;moved=0;lastX=e.clientX;lastY=e.clientY;sceneCanvas.setPointerCapture(e.pointerId)});sceneCanvas.addEventListener('pointermove',e=>{if(!drag||paused)return;moved+=Math.hypot(e.clientX-lastX,e.clientY-lastY);yaw-=(e.clientX-lastX)*.004;pitch-=(e.clientY-lastY)*.002;pitch=Math.max(-.6,Math.min(.6,pitch));lastX=e.clientX;lastY=e.clientY});sceneCanvas.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(moved<7&&hover){if(hover.id==='exit')openArchive(true);else openInspect(hover)}});
addEventListener('keydown',e=>{if(e.target.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){keys[e.key]=true;e.preventDefault()}if(e.key==='Escape'&&active)closeInspect();if((e.key===' '||e.key==='Enter')&&hover&&!paused)(hover.id==='exit'?openArchive(true):openInspect(hover))});addEventListener('keyup',e=>keys[e.key]=false);
function worldChange(){let n=items.filter(i=>i.done).length;$('#flash').classList.add('show');inventory.classList.remove('reveal');void inventory.offsetWidth;inventory.classList.add('reveal');setTimeout(()=>{$('#flash').classList.remove('show');inventory.classList.remove('reveal')},700);if(n===1){material.peach.color.setHex(0xeab293);sun.position.x=-4}if(n===2){floorTiles.forEach((tile,i)=>{if(i%7===0){tile.material=material.blue;tile.position.y=.07}})}if(n===3){floatingFrame.rotation.z=.68;lowShelf.rotation.y=.9}if(n===4){skyBackdrop.style.backgroundColor='#ffddc4';scene.fog.color.setHex(0xf0d7b8)}if(n===5){inner.material.emissive.setHex(0x9ac8c5);inner.material.emissiveIntensity=1.3}if(n===6){let mark=label('?',.8,.8,'#fff6dc');mark.position.set(0,3,.41);exit.add(mark)}renderer.toneMappingExposure=.9+n*.025}
let atExit=false;
function openArchive(fromExit=false){paused=true;keys={};atExit=fromExit&&items.every(i=>i.done);$('#archive').classList.add('show');$('#submit').style.display=atExit?'inline-block':'none';$('.signature').hidden=!atExit;if(atExit)$('#name').focus();playEffect('paper')}
$('#archive-toggle').onclick=()=>openArchive(false);$('#close-archive').onclick=()=>{let panel=$('#archive');panel.classList.add('closing');setTimeout(()=>{panel.classList.remove('show','closing');atExit=false;paused=false},280)};$('#submit').onclick=()=>{if(!atExit||!items.every(i=>i.done)||finished)return;let v=$('#name').value.trim();if(v){finished=true;$('#name').removeAttribute('aria-invalid');$('#end-name').textContent=v;$('#archive').classList.remove('show');$('#flash').classList.add('show');playEffect('door');setTimeout(()=>{$('#end').classList.add('show');$('#flash').classList.remove('show')},1000)}else{$('.archive-card').classList.remove('error');void $('.archive-card').offsetWidth;$('.archive-card').classList.add('error');$('#name').setAttribute('aria-invalid','true');$('#name').focus();playEffect('wood')}};$('#name').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.stopPropagation();$('#submit').click()}});$('#name').addEventListener('input',()=>$('#name').removeAttribute('aria-invalid'));$('#again').onclick=()=>location.reload();
function frame(t){let dt=Math.min(.05,(t-walkTime)/1000||0);walkTime=t;if(!paused&&started&&!finished){let f=(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0),s=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),v=5*dt;camera.position.x=Math.max(-6,Math.min(6,camera.position.x+(-Math.sin(yaw)*f+Math.cos(yaw)*s)*v));camera.position.z=Math.max(-36.5,Math.min(37,camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*v));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;ray.setFromCamera(new T.Vector2(0,0),camera);let hits=ray.intersectObjects(pickMeshes,false);hover=null;for(let h of hits){let it=h.object.userData.item;if(it&&h.distance<5){hover=it;break}}let exitDistance=Math.hypot(camera.position.x,camera.position.z+37);if(exitDistance<4&&Math.cos(yaw)>.4)hover={id:'exit'};$('#crosshair').classList.toggle('hot',!!hover);$('#prompt').classList.toggle('show',!!hover);}let ease=1-Math.exp(-dt*4);skyX+=(Math.sin(yaw)*innerWidth*.035-skyX)*ease;skyY+=(pitch*innerHeight*.055-skyY)*ease;skyBackdrop.style.setProperty('--sky-x',skyX.toFixed(1)+'px');skyBackdrop.style.setProperty('--sky-y',skyY.toFixed(1)+'px');
for(let it of items){it.group.position.y=it.y+Math.sin(t*.001+it.z)*.045}renderer.render(scene,camera);if(active){let w=inspectCanvas.clientWidth,h=inspectCanvas.clientHeight;if(inspectCanvas.width!==Math.round(w*inspectRenderer.getPixelRatio())||inspectCanvas.height!==Math.round(h*inspectRenderer.getPixelRatio())){inspectRenderer.setSize(w,h,false);inspectCamera.aspect=w/h;inspectCamera.updateProjectionMatrix()}inspectRenderer.render(inspectScene,inspectCamera)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
function begin(){started=true;paused=false;$('#intro').classList.add('hide');startAudio()}$('#begin').onclick=begin;$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'♩':'♫';if(master)master.gain.setTargetAtTime(muted?0:.16,audio.currentTime,.2)};
function startAudio(){try{audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.16;master.connect(audio.destination);music();musicTimer=setInterval(music,4700)}catch(e){}}
function noise(at,dur,gain,cut){let n=Math.floor(audio.sampleRate*dur),b=audio.createBuffer(1,n,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;let s=audio.createBufferSource(),f=audio.createBiquadFilter(),v=audio.createGain();s.buffer=b;f.type='lowpass';f.frequency.value=cut;v.gain.setValueAtTime(.0001,at);v.gain.exponentialRampToValueAtTime(gain,at+Math.min(.1,dur*.2));v.gain.exponentialRampToValueAtTime(.0001,at+dur);s.connect(f).connect(v).connect(master);s.start(at)}
function music(){if(!audio)return;let now=audio.currentTime,notes=[196,246.94,293.66,261.63,220,329.63],root=notes[musicStep++%notes.length];for(let [i,mult] of [1,1.5,2].entries()){let o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type='triangle';o.frequency.value=root*mult;f.type='lowpass';f.frequency.value=430;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.065/(i+1),now+.7);g.gain.exponentialRampToValueAtTime(.0001,now+5.7);o.connect(f).connect(g).connect(master);o.start(now);o.stop(now+5.8)}noise(now,4.5,.012,250)}
